<section class="game-shell">
  <canvas #renderCanvas class="game-canvas"></canvas>

  <aside class="hud">
    <h1>Project Patty Prototype</h1>
    <p>Move: WASD or Arrow Keys</p>
    <p>Camera: Mouse Drag + Scroll</p>
  </aside>

  @if (pendingPortal) {
    <div class="modal-backdrop" (click)="dismissPortal()">
      <div class="modal" (click)="$event.stopPropagation()">
        <h2 class="modal-title">Enter Portal</h2>
        <p class="modal-body">Open <strong>{{ pendingPortal.label }}</strong> in a new tab?</p>
        <div class="modal-actions">
          <button class="btn btn-confirm" (click)="confirmPortal()">Open</button>
          <button class="btn btn-cancel" (click)="dismissPortal()">Cancel</button>
        </div>
      </div>
    </div>
  }
</section>
